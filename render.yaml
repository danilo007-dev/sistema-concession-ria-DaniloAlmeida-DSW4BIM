services:
  - type: web
    name: autoviva-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build --workspace apps/api
    startCommand: npm run db:deploy --workspace apps/api && npm run start --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
